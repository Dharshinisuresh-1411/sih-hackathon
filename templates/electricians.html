{% extends "base.html" %}
{% block title %}Electricians{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h4 class="mb-0">Electricians</h4>
  <button class="btn btn-success btn-sm" data-bs-toggle="modal" data-bs-target="#addElectricianModal"><i class="fa-solid fa-plus me-1"></i>Add Electrician</button>
</div>

<div class="card card-section">
  <div class="card-body p-0">
    <table class="table mb-0 align-middle">
      <thead class="table-light"><tr><th>ID</th><th>Name</th><th>Phone</th><th>Status</th><th>Actions</th></tr></thead>
      <tbody id="electriciansBody"></tbody>
    </table>
  </div>
</div>

<div class="modal fade" id="addElectricianModal" tabindex="-1">
  <div class="modal-dialog">
    <form class="modal-content" id="electricianForm">
      <div class="modal-header"><h5 class="modal-title">Add Electrician</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body">
        <div class="mb-2"><label class="form-label">Name</label><input class="form-control" name="name" required></div>
        <div class="mb-2"><label class="form-label">Phone</label><input class="form-control" name="phone" placeholder="10-digit mobile" required></div>
      </div>
      <div class="modal-footer"><button class="btn btn-secondary" type="button" data-bs-dismiss="modal">Cancel</button><button class="btn btn-success" type="submit">Save</button></div>
    </form>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script>
async function loadElectricians() {
  const { ok, data, error } = await apiFetch('/api/electricians');
  if (!ok) return showAlert(error);
  document.getElementById('electriciansBody').innerHTML = data.map(e => `
    <tr>
      <td>${e.id}</td><td>${e.name}</td><td>${e.phone}</td>
      <td><span class="badge ${e.is_active ? 'bg-success' : 'bg-secondary'}">${e.is_active ? 'Active' : 'Inactive'}</span></td>
      <td><button class="btn btn-sm btn-outline-secondary" onclick="toggleElectrician(${e.id})">Toggle</button></td>
    </tr>
  `).join('') || '<tr><td colspan="5" class="text-center text-muted p-3">No electricians yet</td></tr>';
}

async function toggleElectrician(id) {
  const { ok, error } = await apiFetch(`/api/electricians/${id}/toggle`, { method: 'POST' });
  if (!ok) return showAlert(error);
  loadElectricians();
}

document.getElementById('electricianForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const form = new FormData(e.target);
  const payload = Object.fromEntries(form.entries());
  const { ok, error } = await apiFetch('/api/electricians', { method: 'POST', body: JSON.stringify(payload) });
  if (!ok) return showAlert(error);
  bootstrap.Modal.getInstance(document.getElementById('addElectricianModal')).hide();
  e.target.reset();
  showAlert('Electrician added.', 'success');
  loadElectricians();
});

loadElectricians();
</script>
{% endblock %}
