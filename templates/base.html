<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Panchayat Street Light System{% endblock %}</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
<link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg topbar">
  <div class="container-fluid">
    <button class="btn btn-sm text-light d-lg-none" id="sidebarToggle"><i class="fa-solid fa-bars"></i></button>
    <a class="navbar-brand" href="/"><i class="fa-solid fa-lightbulb me-2"></i>Panchayat Street Light System</a>
    <span class="navbar-text text-light-50 small d-none d-md-inline">Complaint &amp; Repair Assignment</span>
  </div>
</nav>

<div class="layout">
  <aside class="sidebar" id="sidebar">
    <a href="/" class="nav-link {{ 'active' if active=='dashboard' }}"><i class="fa-solid fa-chart-line"></i> Dashboard</a>
    <a href="/poles" class="nav-link {{ 'active' if active=='poles' }}"><i class="fa-solid fa-tower-observation"></i> Poles</a>
    <a href="/complaints/new" class="nav-link {{ 'active' if active=='new_complaint' }}"><i class="fa-solid fa-phone"></i> Register Complaint</a>
    <a href="/complaints" class="nav-link {{ 'active' if active=='complaints' }}"><i class="fa-solid fa-list"></i> All Complaints</a>
    <a href="/complaints/open" class="nav-link {{ 'active' if active=='open' }}"><i class="fa-solid fa-triangle-exclamation"></i> Open Complaints</a>
    <a href="/electricians" class="nav-link {{ 'active' if active=='electricians' }}"><i class="fa-solid fa-helmet-safety"></i> Electricians</a>
    <a href="/assign" class="nav-link {{ 'active' if active=='assign' }}"><i class="fa-solid fa-clipboard-check"></i> Assign Complaint</a>
    <a href="/repeat-offenders" class="nav-link {{ 'active' if active=='repeat' }}"><i class="fa-solid fa-rotate"></i> Repeat-Offender Poles</a>
  </aside>

  <main class="content">
    <div id="alertArea"></div>
    {% block content %}{% endblock %}
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="{{ url_for('static', filename='js/main.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
