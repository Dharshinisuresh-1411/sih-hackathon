{% extends "base.html" %}
{% block title %}Dashboard{% endblock %}
{% block content %}
<h4 class="mb-3">Dashboard</h4>

<div class="row g-3" id="kpiRow"></div>

<div class="row g-3 mt-1">
  <div class="col-lg-6">
    <div class="card card-section">
      <div class="card-header">Open Complaints by Ward</div>
      <div class="card-body"><canvas id="wardChart" height="220"></canvas></div>
    </div>
  </div>
  <div class="col-lg-6">
    <div class="card card-section">
      <div class="card-header">Complaint Status Distribution</div>
      <div class="card-body"><canvas id="statusChart" height="220"></canvas></div>
    </div>
  </div>
</div>

<div class="card card-section">
  <div class="card-header d-flex justify-content-between align-items-center">
    <span>Repeat-Offender Pole Ranking</span>
    <span class="badge bg-secondary" id="rankingPeriod"></span>
  </div>
  <div class="card-body p-0">
    <table class="table mb-0 align-middle">
      <thead class="table-light">
        <tr><th>Rank</th><th>Pole</th><th>Ward</th><th>Location</th><th>Total Complaints</th><th>Last Complaint</th><th>Pole Status</th></tr>
      </thead>
      <tbody id="rankingBody"></tbody>
    </table>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
{% endblock %}
